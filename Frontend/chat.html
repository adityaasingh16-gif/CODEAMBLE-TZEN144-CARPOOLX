<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarpoolX AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --peach: #ff8a65; --peach-dark: #f4511e; --soft: #fff0eb; --ink: #2c2c2c; --muted: #747474; --line: #f0e6e0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #fffaf6; color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; display: grid; place-items: center; padding: 20px; }
    .chat-app { width: min(100%, 760px); height: min(760px, calc(100vh - 40px)); background: #fff; border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 18px 55px rgba(77, 35, 15, .12); overflow: hidden; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .back { color: var(--peach-dark); text-decoration: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); }
    .brand { flex: 1; }
    h1 { margin: 0; font-size: 1rem; } .sub { color: var(--muted); font-size: .76rem; margin-top: 3px; }
    #status { color: var(--muted); font-size: .72rem; text-align: right; max-width: 230px; }
    #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, #fff 0%, #fffaf6 100%); }
    .message { max-width: 82%; padding: 12px 14px; line-height: 1.45; font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 16px; }
    .assistant { background: #fff; border: 1px solid var(--line); border-top-left-radius: 4px; align-self: flex-start; }
    .user { background: var(--peach); color: #fff; border-top-right-radius: 4px; align-self: flex-end; }
    .typing { color: var(--muted); font-style: italic; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); background: #fff; }
    textarea { flex: 1; resize: none; min-height: 48px; max-height: 120px; padding: 13px; border: 1px solid var(--line); border-radius: 14px; font: inherit; outline: none; }
    textarea:focus { border-color: var(--peach); box-shadow: 0 0 0 3px rgba(255, 138, 101, .16); }
    button { border: 0; min-width: 50px; border-radius: 14px; color: #fff; background: var(--peach); cursor: pointer; font-size: 1rem; }
    button:hover { background: var(--peach-dark); } button:disabled { cursor: wait; opacity: .6; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 22px 14px; background: #fffaf6; }
    .suggestion { background: var(--soft); color: var(--peach-dark); border: 1px solid #ffd7ca; padding: 7px 10px; min-width: 0; font-size: .75rem; }
    @media (max-width: 600px) { body { padding: 0; } .chat-app { height: 100vh; border-radius: 0; border: 0; } #status { display: none; } }
  </style>
</head>
<body>
  <main class="chat-app">
    <header>
      <a class="back" href="index%20final%201.html" aria-label="Back to dashboard"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="brand"><h1><i class="fa-solid fa-comments" style="color:#ff8a65"></i> CarpoolX Ride Chat</h1><div class="sub">Driver and passenger messages for this ride</div></div>
      <div id="status" aria-live="polite">Loading conversation…</div>
    </header>
    <section id="messages" aria-live="polite" aria-label="Conversation">
    </section>
    <form id="chatForm">
      <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Ask CarpoolX AI…" aria-label="Message"></textarea>
      <button id="sendButton" type="submit" aria-label="Send message"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </main>
  <script src="api-client.js"></script>
  <script src="chat.js"></script>
</body>
</html>
